<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | OKIO Functional Beverage</title>
    <meta name="description" content="Complete your OKIO order with fast, secure Indian payment methods including UPI, Cards, Net Banking, and COD.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #070707;">

    <!-- Minimalist Loader -->
    <div class="okio-loader" id="okio-loader">
        <div class="loader-logo">okio</div>
        <div class="loader-bar-track"><div class="loader-bar-fill"></div></div>
    </div>

    <!-- Distraction-Free Checkout Header -->
    <header class="checkout-header">
        <a href="index.html" class="brand-logo" aria-label="Return to OKIO Home">okio</a>
        <div class="checkout-security-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>256-Bit Encrypted Secure Checkout</span>
        </div>
    </header>

    <!-- Checkout Main Content -->
    <main class="checkout-body">
        <div class="container">
            <div class="checkout-grid">
                
                <!-- Left: Order Form -->
                <form id="checkout-main-form">
                    
                    <!-- Step 1: Contact Information -->
                    <div class="checkout-section">
                        <h3 class="checkout-sec-title">
                            <span class="checkout-step-num">1</span>
                            Contact Information
                        </h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cust-email">Email Address</label>
                                <input type="email" id="cust-email" class="form-control" placeholder="akash@work.io" required>
                            </div>
                            <div class="form-group">
                                <label for="cust-phone">Mobile Number (For WhatsApp/SMS Updates)</label>
                                <input type="tel" id="cust-phone" class="form-control" placeholder="+91 98765 43210" pattern="[0-9+ ]{10,15}" required>
                            </div>
                        </div>
                    </div>

                    <!-- Step 2: Delivery Address -->
                    <div class="checkout-section">
                        <h3 class="checkout-sec-title">
                            <span class="checkout-step-num">2</span>
                            Delivery Address in India
                        </h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cust-fname">First Name</label>
                                <input type="text" id="cust-fname" class="form-control" placeholder="Akash" required>
                            </div>
                            <div class="form-group">
                                <label for="cust-lname">Last Name</label>
                                <input type="text" id="cust-lname" class="form-control" placeholder="Sharma" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="cust-street">Street Address / Suite / Building</label>
                            <input type="text" id="cust-street" class="form-control" placeholder="Flat 402, Signature Towers, 100ft Road" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cust-landmark">Landmark (Optional)</label>
                                <input type="text" id="cust-landmark" class="form-control" placeholder="Near Metro Station">
                            </div>
                            <div class="form-group">
                                <label for="cust-pincode">PIN Code</label>
                                <input type="text" id="cust-pincode" class="form-control" placeholder="560038" maxlength="6" pattern="[0-9]{6}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cust-city">City</label>
                                <input type="text" id="cust-city" class="form-control" placeholder="Bengaluru" required>
                            </div>
                            <div class="form-group">
                                <label for="cust-state">State</label>
                                <select id="cust-state" class="form-control" required>
                                    <option value="Karnataka" selected>Karnataka</option>
                                    <option value="Maharashtra">Maharashtra</option>
                                    <option value="Delhi">Delhi NCR</option>
                                    <option value="Telangana">Telangana</option>
                                    <option value="Tamil Nadu">Tamil Nadu</option>
                                    <option value="Gujarat">Gujarat</option>
                                    <option value="West Bengal">West Bengal</option>
                                    <option value="Other">Other States across India</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Step 3: Payment Methods -->
                    <div class="checkout-section">
                        <h3 class="checkout-sec-title">
                            <span class="checkout-step-num">3</span>
                            Payment Method
                        </h3>
                        
                        <div class="payment-methods-grid">
                            <!-- UPI Option -->
                            <label class="payment-method-card active" id="pay-opt-upi">
                                <input type="radio" name="payment_method" value="UPI" checked>
                                <div class="pay-info">
                                    <h5>UPI (Instant QR, Google Pay, PhonePe, Paytm)</h5>
                                    <p>Zero processing fees. Instant dispatch priority.</p>
                                </div>
                            </label>
                            
                            <!-- UPI Details Expansion -->
                            <div class="upi-details-panel active" id="upi-details-panel">
                                <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 12px;">
                                    <div style="background: #fff; padding: 6px; border-radius: 6px; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center;">
                                        <!-- Simulated QR SVG -->
                                        <svg viewBox="0 0 100 100" width="56" height="56">
                                            <rect width="100" height="100" fill="#fff"/>
                                            <path d="M10 10h30v30h-30z M60 10h30v30h-30z M10 60h30v30h-30z M20 20h10v10h-10z M70 20h10v10h-10z M20 70h10v10h-10z M50 20h5v15h-5z M50 50h30v5h-30z M60 70h20v20h-20z" fill="#000"/>
                                        </svg>
                                    </div>
                                    <div>
                                        <span style="font-size: 0.82rem; color: var(--text-white); font-weight: 600;">Scan QR with any UPI App</span>
                                        <p style="font-size: 0.75rem; color: var(--text-dim);">Or enter your UPI VPA ID below:</p>
                                    </div>
                                </div>
                                <input type="text" class="form-control" placeholder="yourname@okhdfcbank" style="font-size: 0.85rem;">
                            </div>

                            <!-- Cards Option -->
                            <label class="payment-method-card" id="pay-opt-cards">
                                <input type="radio" name="payment_method" value="Cards">
                                <div class="pay-info">
                                    <h5>Credit / Debit Cards (Visa, Mastercard, RuPay)</h5>
                                    <p>Protected by 3D Secure 2.0 verification.</p>
                                </div>
                            </label>

                            <!-- Net Banking -->
                            <label class="payment-method-card" id="pay-opt-nb">
                                <input type="radio" name="payment_method" value="NetBanking">
                                <div class="pay-info">
                                    <h5>Net Banking (HDFC, ICICI, SBI, Axis)</h5>
                                    <p>Direct bank authorization.</p>
                                </div>
                            </label>

                            <!-- Cash on Delivery -->
                            <label class="payment-method-card" id="pay-opt-cod">
                                <input type="radio" name="payment_method" value="COD">
                                <div class="pay-info">
                                    <h5>Cash on Delivery (COD)</h5>
                                    <p>Pay cash or UPI upon delivery.</p>
                                </div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-place-order" id="btn-submit-order">
                        PLACE ORDER • <span id="checkout-total-btn">₹0</span>
                    </button>
                </form>

                <!-- Right: Sticky Order Summary -->
                <div class="order-summary-box">
                    <h3 class="summary-title">Order Summary</h3>

                    <div class="summary-items-list" id="checkout-items-list">
                        <!-- Populated via script -->
                    </div>

                    <div class="promo-input-row">
                        <input type="text" id="chk-promo-input" class="form-control" placeholder="Promo code (e.g. OKIOFIRST)" style="text-transform: uppercase;">
                        <button class="btn btn-secondary btn-apply-promo" id="chk-promo-btn">Apply</button>
                    </div>
                    <div id="chk-promo-msg" style="font-size: 0.78rem; margin-top: -12px; margin-bottom: 16px;"></div>

                    <div class="cart-summary-row">
                        <span>Subtotal</span>
                        <span id="chk-subtotal">₹0</span>
                    </div>
                    <div class="cart-summary-row" id="chk-discount-row" style="display: none;">
                        <span>Discount (<span id="chk-discount-code"></span>)</span>
                        <span id="chk-discount-amount" class="discount-val">-₹0</span>
                    </div>
                    <div class="cart-summary-row">
                        <span>Express Shipping</span>
                        <span id="chk-shipping">FREE</span>
                    </div>
                    <div class="cart-summary-row">
                        <span>GST (Included)</span>
                        <span style="color: var(--text-dim);">12% included</span>
                    </div>
                    <div class="cart-summary-row total-row">
                        <span>Total Due</span>
                        <span id="chk-total" class="total-price">₹0</span>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/okio-data.js"></script>
    <script src="js/okio-store.js"></script>
    <script src="js/main.js"></script>

    <!-- Checkout Submission & State Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const store = window.okioStore;
            if (!store) return;

            // Track checkout started
            store.trackEvent('checkout_started', {
                cart_items_count: store.cart.length,
                subtotal: store.getTotals().subtotal
            });

            // Payment radio toggle
            const payCards = document.querySelectorAll('.payment-method-card');
            const upiPanel = document.getElementById('upi-details-panel');

            payCards.forEach(card => {
                card.addEventListener('click', () => {
                    payCards.forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    const radio = card.querySelector('input[type="radio"]');
                    if (radio) radio.checked = true;

                    if (radio.value === 'UPI') {
                        upiPanel.classList.add('active');
                    } else {
                        upiPanel.classList.remove('active');
                    }
                });
            });

            function renderCheckoutSummary() {
                const totals = store.getTotals();
                const itemsList = document.getElementById('checkout-items-list');
                const subtotalEl = document.getElementById('chk-subtotal');
                const shippingEl = document.getElementById('chk-shipping');
                const totalEl = document.getElementById('chk-total');
                const btnTotalEl = document.getElementById('checkout-total-btn');
                const discRow = document.getElementById('chk-discount-row');

                if (itemsList) {
                    if (store.cart.length === 0) {
                        itemsList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">Your cart is empty. <a href="shop.html" style="color: var(--accent-lime)">Shop Now</a></p>`;
                    } else {
                        itemsList.innerHTML = store.cart.map(item => `
                            <div class="summary-item-row">
                                <div class="summary-item-meta">
                                    <img src="${item.image}" alt="${item.name}">
                                    <div>
                                        <div class="summary-item-name">${item.name}</div>
                                        <div class="summary-item-sub">${item.packLabel} • Qty: ${item.qty}</div>
                                    </div>
                                </div>
                                <div style="font-family: 'Outfit', sans-serif; font-weight: 600;">
                                    ₹${(item.price * item.qty).toLocaleString('en-IN')}
                                </div>
                            </div>
                        `).join('');
                    }
                }

                if (subtotalEl) subtotalEl.textContent = `₹${totals.subtotal.toLocaleString('en-IN')}`;
                if (discRow) {
                    if (totals.discount > 0) {
                        discRow.style.display = 'flex';
                        document.getElementById('chk-discount-code').textContent = totals.promo.code;
                        document.getElementById('chk-discount-amount').textContent = `-₹${totals.discount.toLocaleString('en-IN')}`;
                    } else {
                        discRow.style.display = 'none';
                    }
                }

                if (shippingEl) shippingEl.textContent = totals.shipping === 0 ? 'FREE' : `₹${totals.shipping}`;
                if (totalEl) totalEl.textContent = `₹${totals.total.toLocaleString('en-IN')}`;
                if (btnTotalEl) btnTotalEl.textContent = `₹${totals.total.toLocaleString('en-IN')}`;
            }

            renderCheckoutSummary();

            // Promo code handler
            document.getElementById('chk-promo-btn')?.addEventListener('click', (e) => {
                e.preventDefault();
                const input = document.getElementById('chk-promo-input');
                const msg = document.getElementById('chk-promo-msg');
                if (!input || !msg) return;

                const res = store.applyPromoCode(input.value);
                if (res.success) {
                    msg.textContent = res.message;
                    msg.style.color = 'var(--accent-lime)';
                    renderCheckoutSummary();
                } else {
                    msg.textContent = res.message;
                    msg.style.color = 'var(--accent-rose)';
                }
            });

            // Order Submission
            const form = document.getElementById('checkout-main-form');
            form?.addEventListener('submit', (e) => {
                e.preventDefault();

                if (store.cart.length === 0) {
                    alert("Your cart is empty. Please add items to proceed.");
                    window.location.href = 'shop.html';
                    return;
                }

                const submitBtn = document.getElementById('btn-submit-order');
                submitBtn.disabled = true;
                submitBtn.textContent = 'AUTHORIZING PAYMENT...';

                const orderData = {
                    orderId: `OKIO-${Math.floor(100000 + Math.random() * 900000)}`,
                    date: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }),
                    customer: {
                        name: `${document.getElementById('cust-fname').value} ${document.getElementById('cust-lname').value}`,
                        email: document.getElementById('cust-email').value,
                        phone: document.getElementById('cust-phone').value,
                        address: `${document.getElementById('cust-street').value}, ${document.getElementById('cust-city').value}, ${document.getElementById('cust-state').value} - ${document.getElementById('cust-pincode').value}`
                    },
                    paymentMethod: document.querySelector('input[name="payment_method"]:checked')?.value || 'UPI',
                    items: [...store.cart],
                    totals: store.getTotals()
                };

                // Store completed order in localStorage for confirmation screen
                localStorage.setItem('okio_last_order', JSON.stringify(orderData));

                // Dispatch analytics event
                store.trackEvent('purchase_completed', {
                    order_id: orderData.orderId,
                    total: orderData.totals.total,
                    payment_method: orderData.paymentMethod
                });

                // Clear cart
                setTimeout(() => {
                    store.clearCart();
                    window.location.href = 'order-confirmation.html';
                }, 1200);
            });
        });
    </script>
</body>
</html>
